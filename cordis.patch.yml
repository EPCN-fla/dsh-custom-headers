# Applied by the profile composer (dsh.bundle.patch) when this package is
# added to a profile. Mounts the host half (the `custom-headers` header
# profiles plus the per-model llm dispatch header injection) so the browser
# scanner discovers `dsh.client` and serves `lib/client.js` as
# `/plugins/dsh-custom-headers/client.js`.
#
# The row id is `custom-headers` — NOT the package name — because it doubles
# as the plugin's settings namespace (the key the settings Remote and the
# settings/document-updated event address). Keeping it stable preserves the
# same cordis config location across plugin upgrades.
- insert:
    - id: custom-headers
      name: dsh-custom-headers
